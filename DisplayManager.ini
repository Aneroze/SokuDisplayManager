; DisplayManager - crisp exclusive fullscreen + window sizing for Touhou
; Hisoutensoku (th123 1.10a).
; Use either this or WindowResizer, but never both at the same time.
; If you also use SokuDirectXOptimizations, set its use_d3d9ex=0.

[Display]
; The DisplayManager version that last updated this file. Written by the mod.
IniVersion=1.3.0

; 1 = on, 0 = off.
Enabled=1

; Fullscreen size:
;   FitToScreen      - the largest 4:3 size that fits the screen (can be a
;                      non-integer scale, e.g. x2.25 on 1080p).
;   IntegerScaling   - a whole-number scale (FullscreenScale).
;   CustomResolution - CustomWidth x CustomHeight.
; The FitToScreen / Scale hotkeys change it live.
Mode=FitToScreen

; Scale for Mode=IntegerScaling (x2 = 1280x960); reduced if it doesn't fit.
FullscreenScale=x2

; Window size when windowed (x2 = a 1280x960 game area); reduced to fit the
; screen. The Scale hotkeys change it while windowed.
WindowScale=x2

; Output size for Mode=CustomResolution, in pixels (centered).
CustomWidth=1280
CustomHeight=960

; Color of the borders around the game in fullscreen (RRGGBB).
BackgroundColor=000000

; How the 640x480 image is scaled up (fullscreen, and windowed with
; WindowedFilter=1):
;   Point  - hard pixels, slightly uneven at non-integer scales. Default.
;   Linear - smooth, blurry.
;   Sharp  - crisp pixels with a thin blend at their edges, so they all come
;            out the same size (see Sharpness).
;   xBR    - pixel-art upscaler that smooths diagonal and curved edges.
;            Experimental; needs pixel shader 2.b (else falls back to Linear).
;   Auto   - Sharp plus filtered sprites (see below), with values picked for the
;            output size (the nearest of x2, x2.25, x3). Your own Sharpness and
;            sprite settings come back when you switch to another filter.
Filter=Point

; For Filter=Sharp: 1.0 (bilinear) to 4.0 (about the same as Point); ~1.5 looks
; like WindowResizer. Auto = 2.00 at x2, 4.00 at x2.25, 2.50 at x3.
Sharpness=Auto

; Allow resizing the window by dragging its edges (kept at 4:3).
Resizable=1

; 1 = use Filter when windowed too (resizing the window resets the graphics
; device once: a short hitch). 0 = the game's plain smooth stretch.
WindowedFilter=1

; Who handles Windows' display scaling (125%, 150%, ...) for the game window:
; DisplayManager (1; sizes are real screen pixels, no blur) or Windows (0; it
; stretches the window, blurry). Needs a restart.
DpiAware=1

; Save the Mode / scales / Filter / Sharpness set by hotkeys on exit.
PersistState=1

; Save the window position (PositionX / PositionY) on exit.
PersistPosition=1

; Window position at launch (top-left of the frame, in screen pixels; negative
; is fine for monitors left of / above the main one). Blank = don't move it.
PositionX=
PositionY=

; 1 = a borderless window instead of exclusive fullscreen. Not recommended: it
; adds display latency (frames go through the desktop compositor).
Borderless=0

; --- advanced (rarely need changing) ---
; Filter=xBR tuning. Auto = the value picked for the output size, listed as
; x2 / x2.25 / x3:
;   XbrStrength  0-1, plain pixels to full xBR. Auto: 0.65 / 0.50 / 0.80.
;   XbrCorner    A (roundest) to D (keeps more corners). Auto: B / C / C.
;   XbrSlopes    1 = also smooth 30/60-degree edges. Auto: 0.
;   XbrWidth     smoothed band at edges, 1 = standard. Auto: 2.0 / 0.50 / 0.75.
XbrStrength=Auto
XbrCorner=Auto
XbrSlopes=Auto
XbrWidth=Auto

; Filtered sprites (experimental). The game draws the characters and the stage
; with hard pixels at its camera zoom, so some pixels come out wider than others
; and edges shimmer while it zooms; these draw them with a sharp-bilinear shader
; instead. Filter=Auto turns both on; with other filters, uncomment a line to
; turn it on. 0.5 (smooth) to 16 (about the game's hard pixels). Picked, at
; x2 / x2.25 / x3: characters 1.5 / 1.5 / 1.75, stage 1.75 / 4.0 / 2.5.
;SpriteSharpness=1.5
;BackgroundSharpness=1.75

; Characters' filter strength (0 = the game's hard pixels, 1 = the full filter)
; by camera zoom (1.0 = players close together, 0.5 = farthest apart):
; SpriteNearStrength at 1.0, SpriteFarStrength from SpriteFarZoom (0.5-0.95)
; out, linear in between. Near a whole-number scale it fades back to
; SpriteNearStrength (the pixels are already even there). SpriteFarZoom Auto:
; 0.70 / 0.65 / 0.70 at x2 / x2.25 / x3.
;SpriteNearStrength=0
;SpriteFarStrength=1
;SpriteFarZoom=Auto

; Stage filter strength at its resting zoom (1x, where its pixels are already
; even): 0 = the game's look, 1 = the full filter (glides with the camera but
; is slightly soft at times). Auto: 0.3 / 0.5 / 0.3 at x2 / x2.25 / x3.
;BackgroundRestStrength=Auto

; Screen mode in exclusive fullscreen. 0 = the monitor's native mode
; (recommended); FullscreenRefresh=0 keeps the native refresh rate.
FullscreenWidth=0
FullscreenHeight=0
FullscreenRefresh=0

; Vsync in exclusive fullscreen: -1 = the game's setting (off), 0 = off, 1 = on.
; On: no tearing, up to a frame more latency, and at 62 fps (giuroll's
; enable_f62) on 60 Hz about 2 frames per second are skipped; off, the tear line
; rolls instead. Borderless is always synced.
VSync=-1

; 1 = write DisplayManager.log next to this file (for troubleshooting).
Log=0

[Hotkeys]
; Held with the keys below: Alt, Ctrl, Shift, Win or None.
Modifier=Alt

; Modifier + key (a letter or digit). A commented-out or blank line disables
; that hotkey. FitToScreen / Scale1..6 set the fullscreen size; when windowed,
; Scale1..6 resize the window.
FitToScreen=0
Scale1=1
Scale2=2
Scale3=3
Scale4=4
Scale5=5
Scale6=6
AlwaysOnTop=P
; Open / close the settings menu (mouse-driven; the same settings as the
; hotkeys below, and a Save button).
Menu=M
; Cycle Filter: Point -> Linear -> Sharp -> xBR -> Auto.
CycleFilter=F
; Sharpness -/+ 0.25 (with Shift: 0.05). Switches to Sharp; in Auto, changes
; only Auto's value, until the filter or the output size changes.
SharpnessDown=K
SharpnessUp=L
; Development: cycle the xBR settings (switches to xBR; Shift reverses Strength
; and Width). Not saved; Log=1 logs the values.
;XbrStrength=S
;XbrCorner=C
;XbrSlopes=E
;XbrWidth=W
; Filtered sprites: on/off and -/+ for the characters and the stage (with Shift:
; 0.1 steps). Not saved; in Auto, they change only Auto's values.
;SharpSprites=G
;SpriteSharpnessDown=H
;SpriteSharpnessUp=J
;SharpBackground=B
;BackgroundSharpnessDown=U
;BackgroundSharpnessUp=I
; Strengths -/+ 0.1 (SpriteFarZoom: 0.05). Not saved.
;SpriteNearStrengthDown=R
;SpriteNearStrengthUp=T
;SpriteFarStrengthDown=V
;SpriteFarStrengthUp=N
;SpriteFarZoomDown=Y
;SpriteFarZoomUp=O
;BackgroundRestStrengthDown=Z
;BackgroundRestStrengthUp=X

[Menu]
; Size of the settings menu: Auto (by screen height: 1.0 below 900 px up to 2.0
; from 2000 px), or a factor from 0.75 to 3. The menu's own size slider changes
; it for the session.
Scale=Auto

[Input]
; 1 = let the Windows key work in-game (the game blocks it), e.g. for
; Win+Shift+S. In exclusive fullscreen, the Start menu minimizes the game.
; Needs a restart.
AllowWinKey=0

; VERY EXPERIMENTAL. 1 = when the game window first opens with a Chinese /
; Japanese / Korean input method on (e.g. Pinyin in Chinese mode, whose pop-up
; keeps appearing while you play), switch to a non-CJK keyboard (English US
; first), or else set the input method to its Latin mode. Switch back any time
; as usual (e.g. Shift in Pinyin). With Windows' default settings, this switches
; it for the whole desktop.
StartInLatinInput=0
