; DisplayManager - crisp exclusive fullscreen + window sizing for Touhou Hisoutensoku (th123 1.10a).
; Use either this or WindowResizer, but never both at the same time.
; If you also use SokuDirectXOptimizations, set its use_d3d9ex=0 - its Direct3D 9Ex mode wraps the
; graphics device in a way DisplayManager can't attach to, so nothing here (scaling or hotkeys) will work.

[Display]
; master switch (1 = on, 0 = off)
Enabled=1

; How the game is scaled in FULLSCREEN. One of:
;   FitToScreen       - largest aspect-correct size that fills the screen (fills the height, pillarbox
;                       sides on a 16:9 monitor). Biggest image; may be a non-integer scale.
;   IntegerScaling    - an exact whole-number multiple (see IntegerScaling below). Crisp pixels.
;   CustomResolution  - an exact size in pixels (see CustomWidth / CustomHeight).
; Hotkeys change this live in-game (see [Hotkeys]): the FitToScreen key, and Scale1..Scale6. When
; WINDOWED, the Scale keys instead resize the game window to that scale.
Mode=FitToScreen

; Used when Mode=IntegerScaling (and as the window scale when windowed). Whole-number scale of the
; 640x480 game image (x2 = 1280x960). Automatically reduced if it wouldn't fit your screen.
IntegerScaling=x2

; Used only when Mode=CustomResolution. Exact fullscreen output size in pixels (centered).
CustomWidth=1280
CustomHeight=960

; Color of the border/letterbox area around the game in fullscreen, as RRGGBB hex (000000 = black).
BackgroundColor=000000

; How the 640x480 image is scaled up:
;   Auto   - point (hard pixels) at exact integer scales like 2x/3x, linear (smooth) otherwise. Default.
;   Point  - always hard pixels. Sharper at non-integer sizes (e.g. 1080p = 2.25x), but slightly uneven
;            pixel sizes. This matches how WindowResizer looks. Try this if the image seems soft/blurry.
;   Linear - always smooth (softer).
Filter=Auto

; Allow resizing the window by dragging its edges (1) or not (0). Aspect ratio is locked to 4:3.
; The Scale hotkeys work either way.
Resizable=1

; Remember the current Mode / scale on exit and restore it next launch (1) or not (0).
PersistState=1

; Where the window spawns on launch, in screen pixels. -1 (either value) = don't move it (default; the
; mod leaves the initial window position alone). The live position is never written back to this file.
PositionX=-1
PositionY=-1

; --- advanced (rarely need changing) ---
; Manual fullscreen display mode: the actual screen resolution the monitor is set to in fullscreen (NOT
; the game surface below, and NOT the scaled output size above). Leave at 0 to auto-detect your monitor's
; native resolution (recommended). Set both to force a specific mode, e.g. if auto-detection picks the
; wrong resolution. FullscreenRefresh=0 keeps the native refresh rate.
FullscreenWidth=0
FullscreenHeight=0
FullscreenRefresh=0

; The game's own render size that is grabbed from the backbuffer and upscaled. Leave at 640x480 unless
; the image looks clipped or has a border of leftover pixels.
SourceWidth=640
SourceHeight=480

; write a DisplayManager.log next to this ini for troubleshooting (1) or not (0)
Log=0

; Use a borderless window covering the monitor for "fullscreen" instead of true exclusive fullscreen.
; NOT RECOMMENDED: borderless adds display latency - a legacy Direct3D9 game like this one cannot get the
; direct-flip ("Independent Flip") present path in a window, so it composites through the desktop. Leave
; at 0 unless you specifically want borderless (e.g. easier alt-tab or overlays). 1 = borderless, 0 = exclusive.
Borderless=0

[Hotkeys]
; The modifier held together with the keys below: Alt, Ctrl, Shift, Win, or None.
Modifier=Alt

; Each hotkey is the Modifier + the key below (a single letter or digit). Commenting out (or blanking) a
; line DISABLES that hotkey. FitToScreen / Scale1..Scale6 switch the fullscreen scaling mode, or resize
; the window when windowed. AlwaysOnTop toggles always-on-top.
FitToScreen=0
Scale1=1
Scale2=2
Scale3=3
Scale4=4
Scale5=5
Scale6=6
AlwaysOnTop=P
; Cycle the Filter (Auto -> Point -> Linear) live, without restarting - handy for comparing sharpness.
CycleFilter=F
