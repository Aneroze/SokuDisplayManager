; DisplayManager - crisp exclusive fullscreen + window sizing for Touhou
; Hisoutensoku (th123 1.10a).
; Use either this or WindowResizer, but never both at the same time (same for
; IntegerFullscreen / ExclusiveFullscreen). If one of them is loaded,
; DisplayManager disables itself and leaves the game alone.
; If you also use SokuDirectXOptimizations, set its use_d3d9ex=0 - its
; Direct3D 9Ex mode wraps the graphics device in a way DisplayManager can't
; attach to, so nothing here (scaling or hotkeys) will work.

[Display]
; The DisplayManager version that last updated this file. Written by the mod;
; leave it alone. When a newer version starts, it rewrites this file as its own
; default ini with your settings kept, so new options and their notes appear.
IniVersion=1.1.3

; master switch (1 = on, 0 = off)
Enabled=1

; How the game is scaled in FULLSCREEN. One of:
;   FitToScreen      - largest aspect-correct size that fills the screen (fills
;                      the height, pillarboxes the sides on a 16:9 monitor).
;                      Biggest image; may be a non-integer scale.
;   IntegerScaling   - an exact whole-number multiple (see FullscreenScale
;                      below). Perfectly even pixels (hard with Filter=Point).
;   CustomResolution - an exact size in pixels (see CustomWidth/CustomHeight).
; Hotkeys change this live in-game (see [Hotkeys]): the FitToScreen key, and
; Scale1..Scale6. When WINDOWED, the Scale keys instead resize the game window
; (see WindowScale) and leave this setting alone.
Mode=FitToScreen

; FULLSCREEN size when Mode=IntegerScaling: a whole-number scale of the 640x480
; game image (x2 = 1280x960). Automatically reduced if it wouldn't fit your
; screen. The Scale hotkeys change it while fullscreen. (Called IntegerScaling
; before v1.0.4; an old ini is still read and renamed automatically.)
FullscreenScale=x2

; WINDOW size (windowed mode), as a whole-number scale of 640x480
; (x2 = a 1280x960 client area). The Scale hotkeys change it while windowed;
; it is separate from the fullscreen Mode above. Reduced to the largest scale
; that fits your monitor's work area, and the window is kept on-screen. If
; missing, the FullscreenScale value is used.
WindowScale=x2

; Used only when Mode=CustomResolution. Exact fullscreen output size in pixels
; (centered).
CustomWidth=1280
CustomHeight=960

; Color of the border/letterbox area around the game in fullscreen, as RRGGBB
; hex (000000 = black).
BackgroundColor=000000

; How the 640x480 image is scaled up (in fullscreen, and also windowed with
; WindowedFilter=1):
;   Point  - hard pixels (slightly uneven at non-integer sizes like 1080p's
;            2.25x).
;   Linear - smooth (softer).
;   Sharp  - tunable sharp-bilinear (see Sharpness). Reproduces WindowResizer's
;            look (WR's smoothness is D3D9's windowed-present bilinear; Sharp
;            matches it with correct texel alignment).
;   xBR    - pixel-art upscaler (xBR-lv2): smooths diagonal and curved edges in
;            the sprites while flat areas stay crisp. Experimental: the game's
;            frame isn't pure pixel art (the stages and zoomed sprites are
;            already smooth), so the effect varies. Needs a GPU with pixel
;            shader 2.b support (any from the last ~15 years); falls back to
;            Linear otherwise.
; Default is Sharp.
Filter=Sharp

; Only used when Filter=Sharp. Range 1.0-4.0: 1.0 = plain (correctly-aligned)
; bilinear, like WindowResizer's smooth upscale; higher narrows the
; interpolation toward hard pixels (crisper); ~1.5 closely matches WR and ~4.0
; is effectively point. Adjust live with the SharpnessDown / SharpnessUp hotkeys
; (the current value briefly shows on-screen); saved if PersistState=1.
Sharpness=1.50

; Filter=xBR tuning. The Xbr* hotkeys in [Hotkeys] (commented out by default)
; cycle these live; the log (Log=1) records the values after each change so you
; can copy them here.
;   XbrStrength  0.0-1.0: blend between plain pixels (0) and full xBR (1).
;                Default 0.65 (full xBR looks too strong).
;   XbrCorner    A-D: how eagerly corners get rounded. A = roundest, B = the
;                usual xBR, C/D keep more corners and small details.
;   XbrSlopes    1 = also smooth 30/60-degree edges, 0 = 45-degree diagonals
;                only (default).
;   XbrWidth     width of the smoothed band at edges (1.0 = standard xBR; lower
;                = crisper, higher = softer). Default 2.0.
; Slopes and Width are hard to see at x2; compare them at x3 or higher.
XbrStrength=0.65
XbrCorner=B
XbrSlopes=0
XbrWidth=2.0

; EXPERIMENTAL - sharp sprites. OFF while both lines below stay commented out
; (start with ';'): remove the ';' to turn one on. The game draws the
; characters and the stage with hard pixels at its camera zoom, which is almost
; never a whole number, so some sprite pixels come out wider than others and
; edges crawl or shimmer while the camera zooms. This draws them with a
; sharp-bilinear shader instead: each sprite pixel stays crisp inside and only
; its edges get a thin blend, so they all come out the same size. Works with
; any Filter, in fullscreen and windowed.
;   SpriteSharpness     - the characters. 2.5 suggested.
;   BackgroundSharpness - the stage. 1.5 suggested.
; Range 0.5-16: higher = crisper (closer to the game's hard pixels), lower =
; smoother. The sharp-sprite hotkeys in [Hotkeys] (also commented out) turn
; them on/off and adjust them live; live changes are not saved.
;SpriteSharpness=2.5
;BackgroundSharpness=1.5

; With sharp sprites on: what happens at the camera's resting zoom (the
; characters close together: exactly 2x for them, 1x for the stage), where the
; game's hard pixels are already all the same size. 0 = the game's own look,
; 1 = the full filter, in between a mix. The full filter moves smoothly as the
; camera drifts by fractions of a pixel (hard pixels step a whole pixel at a
; time), but at some camera positions it softens everything slightly.
; Defaults: 0 for the characters (pixel art: the softening shows), 0.5 for the
; stage.
;SpriteRestStrength=0
;BackgroundRestStrength=0.5

; Allow resizing the window by dragging its edges (1) or not (0). Aspect ratio
; is locked to 4:3. The Scale hotkeys work either way.
Resizable=1

; Use the Filter above in WINDOWED mode too (1), or let the game stretch its
; 640x480 image over the window the plain way (0; always smooth/bilinear, like
; WindowResizer). With 1, the game's backbuffer is made the size of the window,
; so changing the window size resets the graphics device once: a short hitch
; after you let go of a drag-resize or press a Scale key (the image is
; stretched while you drag). No effect on display latency.
WindowedFilter=1

; Remember the current Mode / scales / Filter / Sharpness on exit and restore
; them next launch (1=yes). (This is how live Alt+F / Alt+K / Alt+L tweaks
; stick.)
PersistState=1

; Remember where the window was on exit (written to PositionX / PositionY
; below) and open it there next launch (1=yes). Exiting from fullscreen or
; while minimized saves the last normal window position. 0 = never write the
; position; PositionX / PositionY stay as you set them.
PersistPosition=1

; Where the window spawns on launch, in screen pixels (top-left corner of the
; window frame; negative values are fine for monitors left of / above the main
; one). Leave both blank to not move it (the game's own position). Kept
; on-screen if the monitor is gone. Updated on exit if PersistPosition=1.
PositionX=
PositionY=

; --- advanced (rarely need changing) ---
; Manual fullscreen display mode: the actual screen resolution the monitor is
; set to in fullscreen (NOT the game surface, and NOT the scaled output size
; above). Leave at 0 to auto-detect your monitor's native resolution
; (recommended). Set both to force a specific mode, e.g. if auto-detection
; picks the wrong resolution. FullscreenRefresh=0 keeps the native refresh rate.
; A mode the monitor doesn't list falls back to the current desktop mode (a
; missing refresh rate snaps to the closest one); if the driver still refuses,
; the game's own fullscreen is used instead.
FullscreenWidth=0
FullscreenHeight=0
FullscreenRefresh=0

; Vertical sync in EXCLUSIVE fullscreen. -1 = leave it to the game (default:
; th123 has vsync off, unless SokuDirectXOptimizations' vsync setting turns it
; on), 0 = force off, 1 = force on.
; Vsync off: lowest latency. At 60 fps on a 60 Hz screen the tear line mostly
; sits still, but at 62 fps (giuroll's enable_f62, used for CN netplay) it
; rolls up the whole screen about twice a second.
; Vsync on: no tearing, up to one frame more latency, and at 62 fps on 60 Hz
; about 2 frames per second are skipped. A 120 Hz+ screen avoids both
; problems at 62 fps, as does G-Sync/FreeSync.
; Borderless=1 is always synced by the desktop, so this has no effect there.
VSync=-1

; write a DisplayManager.log next to this ini for troubleshooting (1) or not (0)
Log=0

; Use a borderless window covering the monitor for "fullscreen" instead of true
; exclusive fullscreen. NOT RECOMMENDED: borderless adds display latency - a
; legacy Direct3D9 game like this one cannot get the direct-flip ("Independent
; Flip") present path in a window, so it composites through the desktop. Leave
; at 0 unless you specifically want borderless (e.g. easier alt-tab or
; overlays). 1 = borderless, 0 = exclusive.
Borderless=0

[Hotkeys]
; The modifier held together with the keys below: Alt, Ctrl, Shift, Win, or
; None.
Modifier=Alt

; Each hotkey is the Modifier + the key below (a single letter or digit).
; Commenting out (or blanking) a line DISABLES that hotkey. FitToScreen /
; Scale1..Scale6 switch the fullscreen scaling mode; when windowed, Scale1..6
; resize the window instead (WindowScale). AlwaysOnTop toggles always-on-top.
FitToScreen=0
Scale1=1
Scale2=2
Scale3=3
Scale4=4
Scale5=5
Scale6=6
AlwaysOnTop=P
; Cycle the Filter (Point -> Linear -> Sharp -> xBR) live, without restarting -
; handy for comparing.
CycleFilter=F
; When Filter=Sharp, decrease / increase the Sharpness live (1.0 =
; bilinear/smooth, higher = crisper).
SharpnessDown=K
SharpnessUp=L
; Development (off by default - uncomment to use): cycle the xBR settings in
; [Display] live, switching to Filter=xBR. Not saved; with Log=1 the log records
; the values after each press. Strength 1.0 -> 0.8 -> 0.65 -> 0.5 -> 0.35 ->
; 0.2; Corner A -> D; 30/60-degree edges on/off; Width 1.0 -> 2.0 -> 0.25 -> 0.5.
;XbrStrength=S
;XbrCorner=C
;XbrSlopes=E
;XbrWidth=W
; Experimental sharp sprites (see SpriteSharpness in [Display]; off by default -
; uncomment to use). SharpSprites / SharpBackground turn the characters' /
; the background's on and off (on = the [Display] value, or 2.5 / 1.5 if
; that line is commented out); the Down / Up keys step the value through
; 0.5 ... 16. Not saved.
;SharpSprites=G
;SpriteSharpnessDown=H
;SpriteSharpnessUp=J
;SharpBackground=B
;BackgroundSharpnessDown=U
;BackgroundSharpnessUp=I
; Tuning the rest strengths above live (0.1 steps; not saved):
;SpriteRestStrengthDown=R
;SpriteRestStrengthUp=T
;BackgroundRestStrengthDown=Z
;BackgroundRestStrengthUp=X

[Input]
; Let the Windows key work while the game has focus (1) or block it (0).
; The base game blocks it (its DirectInput keyboard uses DISCL_NOWINKEY) so a
; stray Win press can't pull you out of a match. 1 = allow it, e.g. for
; Win+Shift+S screenshots or Win+Ctrl+Left/Right desktop switching. In
; exclusive fullscreen, opening the Start menu minimizes the game like
; Alt+Tab. Needs a game restart to change.
AllowWinKey=0

; Open the game on a Latin keyboard instead of a Chinese / Japanese / Korean
; input method (1), or leave the input method alone (0). For players whose
; game window starts with e.g. Microsoft Pinyin in Chinese mode, which then
; composes from the game's keys (its pop-up keeps appearing while you play).
; Once, when the game window first comes up, and only if the input method is
; on in its native mode (Chinese / hiragana / Hangul): switches to an installed
; non-CJK keyboard (English US first); with none, sets the input method the way
; its own toggle key would (Chinese / Japanese: off; Korean: English mode). It
; is never disabled: switch back any time with Shift in Pinyin, Han/Eng in
; Korean, Hankaku/Zenkaku in Japanese, Alt+Shift / Ctrl+Shift (if turned on in
; Windows' input settings), or the taskbar's language button. Win+Space only
; works in-game with AllowWinKey=1 above. With Windows' default "use the same
; input method for all apps", this switches it for the whole desktop, like
; doing it by hand.
StartInLatinInput=0
