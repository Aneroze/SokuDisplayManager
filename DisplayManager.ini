; DisplayManager - crisp exclusive fullscreen + window sizing for Touhou Hisoutensoku (th123 1.10a).
; Disable WindowResizer when using this mod (they both manage the window/fullscreen path).

[Display]
; master switch (1 = on, 0 = off)
Enabled=1

; How the game is scaled in FULLSCREEN. One of:
;   FitToScreen       - largest aspect-correct size that fills the screen (fills the height, pillarbox
;                       sides on a 16:9 monitor). Biggest image; may be a non-integer scale.
;   IntegerScaling    - an exact whole-number multiple (see IntegerScaling below). Crisp pixels.
;   CustomResolution  - an exact size in pixels (see CustomWidth / CustomHeight).
; Hotkeys change this live in-game: Alt+0 = FitToScreen, Alt+1..Alt+4 set the scale. When WINDOWED, the
; same Alt+1..4 instead resize the game window to that scale.
Mode=FitToScreen

; Used when Mode=IntegerScaling (and as the window scale when windowed). Whole-number scale of the
; 640x480 game image (x2 = 1280x960). Automatically reduced if it wouldn't fit your screen.
IntegerScaling=x2

; Used only when Mode=CustomResolution. Exact fullscreen output size in pixels (centered).
CustomWidth=1280
CustomHeight=960

; Color of the border/letterbox area around the game in fullscreen, as RRGGBB hex (000000 = black).
BackgroundColor=000000

; Allow resizing the window by dragging its edges (1) or not (0). Aspect ratio is locked to 4:3.
; Alt+1..4 hotkey resizing works either way.
Resizable=1

; Remember the current Mode / scale on exit and restore it next launch (1) or not (0).
PersistState=1

; Where the window spawns on launch, in screen pixels. -1 (either value) = don't move it (default; the
; mod leaves the initial window position alone). The live position is never written back to this file.
PositionX=-1
PositionY=-1

; --- advanced (rarely need changing) ---
; The game's own render size that is grabbed from the backbuffer and upscaled. Leave at 640x480 unless
; the image looks clipped or has a border of leftover pixels.
SourceWidth=640
SourceHeight=480

; write an DisplayManager.log next to this ini for troubleshooting (1) or not (0)
Log=0
