; ExclusiveFullscreen - crisp exclusive fullscreen for Touhou Hisoutensoku (th123 1.10a).
; Disable WindowResizer when using this mod (they both manage the fullscreen path).

[Fullscreen]
; master switch (1 = on, 0 = off)
Enabled=1

; How the game is scaled in fullscreen. One of:
;   FitToScreen       - largest aspect-correct size that fills the screen (fills the height, pillarbox
;                       sides on a 16:9 monitor). Biggest image; may be a non-integer scale.
;   IntegerScaling    - an exact whole-number multiple (see IntegerScaling below). Crisp pixels.
;   CustomResolution  - an exact size in pixels (see CustomWidth / CustomHeight).
; Hotkeys change this live in-game: Alt+0 = FitToScreen, Alt+1..Alt+4 = IntegerScaling x1..x4.
Mode=FitToScreen

; Used only when Mode=IntegerScaling. The whole-number scale of the 640x480 game image (x2 = 1280x960).
; Automatically reduced if it wouldn't fit your screen.
IntegerScaling=x2

; Used only when Mode=CustomResolution. Exact output size in pixels (centered). Keep width = height*4/3
; and a whole multiple of 640x480 for perfectly crisp pixels.
CustomWidth=1280
CustomHeight=960

; --- advanced (rarely need changing) ---
; The game's own render size that is grabbed from the backbuffer and upscaled. Leave at 640x480 unless
; the image looks clipped or has a border of leftover pixels.
SourceWidth=640
SourceHeight=480

; write an ExclusiveFullscreen.log next to this ini for troubleshooting (1) or not (0)
Log=0
