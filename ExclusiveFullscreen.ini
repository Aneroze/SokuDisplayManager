; ExclusiveFullscreen - crisp, integer-scaled exclusive fullscreen.
; Disable WindowResizer when using this mod (they both manage the fullscreen path).

[Fullscreen]
; master switch (1 = on, 0 = off)
Enabled=1

; Largest integer scale to use in fullscreen. The mod picks the biggest integer multiple of the source
; (640x480) that fits your monitor, but never more than this. 2 = up to 2x (1280x960); it drops to 1x
; automatically on screens too small for 2x. Set 3 to allow 3x (1920x1440) on tall enough monitors, etc.
MaxScale=2

; Exact output override in pixels. Set BOTH to force a specific size (centered, black borders), ignoring
; MaxScale - e.g. WidthOverride=1280 HeightOverride=960. Leave at 0 to use the MaxScale auto-fit above.
; (Keep width = height * 4 / 3 and an integer multiple of the source for crisp pixels.)
WidthOverride=0
HeightOverride=0

; The game's own render size that is grabbed from the backbuffer and upscaled. Leave at 640x480 unless
; the game surface appears clipped or with a border of leftover pixels (then adjust to match it).
SourceWidth=640
SourceHeight=480

; write an ExclusiveFullscreen.log next to this ini for troubleshooting (1) or not (0)
Log=0
